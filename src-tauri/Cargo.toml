[package]
name = "content-command-x"
version = "2.0.0"
description = "Content Command X - Desktop content planner for X/Twitter"
authors = ["JeepMeta"]
edition = "2021"

[lib]
name = "content_command_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
}
